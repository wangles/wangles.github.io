<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Will Wangles</title>
  <meta name="description" content="Will Wangles — personal site. Something new is on the way.">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg: #fafaf8;
      --fg: #1c1c1a;
      --muted: #6b6b66;
      --line: #dcdcd6;
      --accent: #174282;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #ececea;
        --muted: #9a9a94;
        --line: #2c2c2a;
        --accent: #8fb3ea;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { max-width: 34rem; width: 100%; }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    .rule { height: 1px; background: var(--line); margin: 2rem 0 1.25rem; }
    nav a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      margin-right: 1.5rem;
    }
    nav a:hover, nav a:focus-visible { border-bottom-color: currentColor; }
  </style>
</head>
<body>
  <main>
    <h1>Will Wangles</h1>
    <p>Something new is on the way. Check back soon.</p>
    <div class="rule"></div>
    <nav>
      <a href="https://github.com/wangles">GitHub</a>
      <a href="https://www.linkedin.com/in/wangles/">LinkedIn</a>
    </nav>
  </main>
</body>
</html>
